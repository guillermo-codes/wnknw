name: K2 Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-lockfile:
    name: Resolve exact npm lockfile
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Use Node 26 LTS for lockfile generation
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Generate or verify package-lock.json
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          } else {
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          }
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo resolver package-lock.json desde el registro npm.' }
          if (-not (Test-Path package-lock.json)) { throw 'npm no creó package-lock.json.' }
      - name: Preserve lockfile as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: k2-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated lockfile on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'chore(deps): lock exact npm dependency tree [skip ci]'
            git push
          }

  verify:
    name: Node ${{ matrix.node }} / Windows
    needs: resolve-lockfile
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download resolved lockfile
        uses: actions/download-artifact@v4
        with:
          name: k2-package-lock
          path: .
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify syntax, tests and release package
        run: npm run verify
      - name: Parse PowerShell launchers
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path launcher -Filter '*.ps1' -File
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax error in $($file.Name)"
            }
          }